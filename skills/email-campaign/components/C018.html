<tr em="block">
  <td align="center" style="padding:10px 40px;" class="em-mob-padding_left-20 em-mob-padding_right-20">
    <table border="0" cellspacing="0" cellpadding="0" width="100%"><tr>
      <td dir="ltr" align="center" width="580" valign="top" class="em-mob-width-100perc em-card" style="background-color:#ffffff; border-radius:16px; border:1.5px solid #FFE8D8; padding:20px 0 0;">
        <table border="0" cellspacing="0" cellpadding="0" width="100%" style="padding:0 20px;"><tr>
          <td dir="ltr" width="260" valign="middle" class="em-mob-wrap em-mob-width-100perc">
            <table cellpadding="0" cellspacing="0" border="0" width="100%" em="atom"><tr><td style="padding-bottom:20px;"><a href="{{url|url}}" target="_blank"><img src="{{image}}" width="259" border="0" alt="{{alt}}" style="display:block; width:100%; max-width:259px; border-radius:8px;" class="em-mob-width-100perc"></a></td></tr></table>
          </td>
          <td width="20" class="em-mob-wrap">&nbsp;</td>
          <td dir="ltr" width="260" valign="middle" class="em-mob-wrap em-mob-width-100perc">
            <table border="0" cellspacing="0" cellpadding="0" em="atom"><tr><td align="center" bgcolor="#EB3737" height="19" style="height:19px; padding:0 8px; border-radius:51px;"><div style="font-family:'Rubik','Trebuchet MS',Arial,sans-serif; font-size:10px; line-height:15px; color:#ffffff;">{{badge}}</div></td></tr></table>
            <table cellpadding="0" cellspacing="0" border="0" width="100%" em="atom"><tr><td style="padding:10px 0 5px;"><a href="{{url|url}}" target="_blank" style="font-family:Rubik,'Trebuchet MS',Arial,sans-serif; font-size:18px; line-height:23px; color:#ff732d; text-decoration:none;"><strong>{{title}}</strong></a></td></tr></table>
            <table cellpadding="0" cellspacing="0" border="0" width="100%" em="atom"><tr><td style="padding-bottom:10px;"><div style="font-family:'Inter','Trebuchet MS',Arial,sans-serif; font-size:14px; line-height:18px; color:#2a2a2a;">{{route}}</div></td></tr></table>
            <table cellpadding="0" cellspacing="0" border="0" width="100%" em="atom"><tr><td style="padding-bottom:12px;"><div style="font-family:'Inter',Verdana,Arial,sans-serif; font-size:12px; color:#999999; font-weight:500;">{{meta}}</div></td></tr></table>
            <table cellpadding="0" cellspacing="0" border="0" width="100%" em="atom"><tr><td style="padding-bottom:10px;"><div style="font-family:'Rubik','Trebuchet MS',Arial,sans-serif; font-size:16px; line-height:21px; color:#2a2a2a;"><strong>{{price}}</strong></div></td></tr></table>
            <table cellpadding="0" cellspacing="0" border="0" width="80%" align="center" class="em-mob-width-100perc" style="width:80%;" em="atom"><tr><td align="center" valign="middle" height="30" style="background-color:#ff732d; border-radius:50px; border-bottom:3px solid rgba(140,40,0,.4); height:30px;"><a href="{{url|url}}" target="_blank" style="display:block; height:30px; font-family:Rubik,'Trebuchet MS',Arial,sans-serif; color:#ffffff; font-size:16px; line-height:30px; text-decoration:none; white-space:nowrap;">{{cta}}</a></td></tr></table>
          </td>
        </tr></table>
      </td>
    </tr></table>
  </td>
</tr>
