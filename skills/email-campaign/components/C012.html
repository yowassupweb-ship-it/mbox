<tr em="block">
  <td align="center" style="padding:10px 40px;" class="em-mob-padding_left-20 em-mob-padding_right-20">
    <table width="100%" cellpadding="0" cellspacing="0" border="0" style="background-color:#ff732d; border-radius:20px;" bgcolor="#ff732d" em="atom"><tr>
      <td align="center" style="padding:25px 20px;">
        <div style="color:#ffffff; font-size:16px; font-weight:700; font-family:Rubik,Verdana,sans-serif; padding-bottom:10px;">{{title}}</div>
        <div style="color:#ffffff; font-size:14px; font-family:Rubik,sans-serif; line-height:1.5; padding-bottom:18px;">{{text|text}}</div>
        <table cellpadding="0" cellspacing="0" border="0" align="center"><tr><td align="center" valign="middle" style="background:#ffffff; border-radius:50px; border-bottom:3px solid rgba(0,0,0,0.15);"><a href="{{url|url}}" target="_blank" style="display:block; padding:14px 35px; color:#ff732d; font-size:14px; font-weight:600; font-family:'Rubik',sans-serif; text-decoration:none;">{{cta}}</a></td></tr></table>
      </td>
    </tr></table>
  </td>
</tr>
