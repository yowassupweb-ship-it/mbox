<tr em="block">
  <td align="center" style="padding:10px 40px 16px;" class="em-mob-padding_left-20 em-mob-padding_right-20">
    <table cellpadding="0" cellspacing="0" border="0" width="100%" style="border:1.5px solid #ffe8d8; border-radius:20px; background:#fff8f4;" em="atom"><tr>
      <td align="center" style="padding:18px 20px 20px;">
        <div style="font-family:Rubik,Arial,sans-serif; font-size:18px; font-weight:700; color:#2a2a2a; line-height:1.3;">{{title}}</div>
        <div style="padding:12px 0;"><span style="display:inline-block; background:#ff732d; color:#ffffff; font-family:Rubik,Arial,sans-serif; font-size:22px; font-weight:700; letter-spacing:1px; padding:8px 18px; border-radius:12px;">{{code}}</span></div>
        <div style="font-family:Rubik,Arial,sans-serif; font-size:14px; line-height:1.6; color:#464646;">{{how|text}}</div>
      </td>
    </tr></table>
  </td>
</tr>
