<tr em="block">
  <td align="center" style="padding:6px 40px 10px;" bgcolor="#FFFFFF" class="em-mob-padding_left-20 em-mob-padding_right-20">
    <table cellpadding="0" cellspacing="0" border="0" width="100%" style="border-radius:20px; overflow:hidden;">
      <tr em="atom"><td style="line-height:0;"><a href="{{url|url}}" target="_blank"><img src="{{image}}" alt="{{alt}}" width="580" style="display:block; width:100%; max-width:580px; max-height:200px; object-fit:cover;"></a></td></tr>
      <tr><td style="background-color:#ff732d; padding:20px 26px 26px;" bgcolor="#ff732d" align="center">
        <div style="font-family:Rubik,'Trebuchet MS',Arial,sans-serif; font-weight:700; font-size:24px; color:#ffffff; line-height:1.2; padding-bottom:8px;">{{title}}</div>
        <div style="font-family:Rubik,Verdana,Arial,sans-serif; font-size:16px; color:#ffffff; line-height:1.5; padding-bottom:15px;">{{text|text}}</div>
        <table cellpadding="0" cellspacing="0" border="0" align="center" em="atom"><tr><td align="center" style="background-color:#ffffff; border-radius:50px; border-bottom:3px solid rgba(0,0,0,.15); height:42px;"><a href="{{url|url}}" target="_blank" style="display:block; height:42px; font-family:'Rubik',sans-serif; font-weight:700; color:#ff732d; font-size:16px; line-height:42px; text-decoration:none; white-space:nowrap; padding:0 26px;">{{cta}}</a></td></tr></table>
      </td></tr>
    </table>
  </td>
</tr>
