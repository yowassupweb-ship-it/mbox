<tr em="block">
  <td align="center" style="padding:25px 40px;" class="em-mob-padding_left-20 em-mob-padding_right-20 em-mob-padding_top-20">
    <table border="0" cellspacing="0" cellpadding="0" width="100%" style="background-color:#ff732d; border-radius:20px;" bgcolor="#ff732d"><tr><td align="center" style="padding:25px 20px;">
      <table cellpadding="0" cellspacing="0" border="0" width="100%" em="atom"><tr><td align="center"><div style="color:#ffffff; font-size:18px; font-weight:700; font-family:Inter,Verdana,Arial,sans-serif; padding-bottom:10px;">{{title}}</div><div style="color:#ffffff; font-size:13px; font-family:Inter,Arial,sans-serif; line-height:1.5; padding-bottom:18px;"><strong>Телефон:</strong> <a href="{{phone_url|url}}" style="color:#ffffff; text-decoration:none;">{{phone}}</a><br><strong>Email:</strong> <a href="mailto:{{email}}" style="color:#ffffff; text-decoration:none;">{{email}}</a></div></td></tr></table>
      <table cellpadding="0" cellspacing="0" border="0" align="center" em="atom"><tr><td align="center" valign="middle" style="background:#ffffff; border-radius:50px; border-bottom:3px solid rgba(0,0,0,.15);"><a href="{{url|url}}" target="_blank" style="display:block; padding:14px 35px; color:#ff732d; font-size:14px; font-weight:600; font-family:Inter,Arial,sans-serif; text-decoration:none;">{{cta}}</a></td></tr><tr><td align="center" style="padding-top:16px;"><div style="color:#ffffff; font-size:14px; font-family:Inter,Arial,sans-serif;">{{thanks}}</div></td></tr></table>
    </td></tr></table>
  </td>
</tr>
