<tr em="block">
  <td align="center" style="padding:0 40px 8px;" bgcolor="#FFFFFF" class="em-mob-padding_left-20 em-mob-padding_right-20">
    <table cellpadding="0" cellspacing="0" border="0" width="100%" style="border-radius:20px; overflow:hidden;"><tr>
    <td style="background:#fff8f4; padding:24px 22px 16px; vertical-align:middle;" class="em-mob-wrap em-mob-width-100perc">
      <table cellpadding="0" cellspacing="0" border="0" width="100%" em="atom"><tr><td style="padding-bottom:10px;"><div style="font-family:Rubik,'Trebuchet MS',Arial,sans-serif; font-weight:700; font-size:18px; line-height:1.2; color:#2a2a2a;"><a href="{{url|url}}" target="_blank" style="text-decoration:underline; color:#ff732d;">{{title}}</a></div></td></tr></table>
      <table cellpadding="0" cellspacing="0" border="0" width="100%" em="atom"><tr><td style="padding-bottom:8px;"><div style="font-family:'Inter',Verdana,Arial,sans-serif; font-size:13px; color:#777777; line-height:1.6;">{{route}}</div></td></tr></table>
      <table cellpadding="0" cellspacing="0" border="0" width="100%" em="atom"><tr><td style="padding-bottom:14px;"><div style="font-family:'Inter',Verdana,Arial,sans-serif; font-size:12px; color:#999999; font-weight:500;">{{meta}}</div></td></tr></table>
      <table cellpadding="0" cellspacing="0" border="0" align="center" em="atom"><tr><td align="center" style="background-color:#ff732d; border-radius:50px; border-bottom:3px solid rgba(140,40,0,.4); height:36px;"><a href="{{url|url}}" target="_blank" style="display:block; height:36px; font-family:'Rubik','Trebuchet MS',Arial,sans-serif; font-weight:700; color:#ffffff; font-size:12px; line-height:36px; text-decoration:none; white-space:nowrap; padding:0 22px;">{{cta}}</a></td></tr></table>
    </td>
    <td width="48%" class="em-mob-wrap em-mob-width-100perc" style="line-height:0; vertical-align:top;" em="atom"><a href="{{url|url}}" target="_blank"><img src="{{image}}" alt="{{alt}}" width="100%" style="display:block; width:100%; min-height:240px; object-fit:cover;"></a></td>
    </tr></table>
  </td>
</tr>
