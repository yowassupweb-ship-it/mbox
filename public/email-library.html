rCodeAt(0))));const list=document.querySelector('#list'),count=document.querySelector('#count'),search=document.querySelector('#search');function doc(block){return '<!doctype html><html><head>'+data.head+'</head><body style="margin:0;background:#fff"><table role="presentation" cellpadding="0" cellspacing="0" width="100%" style="max-width:660px;margin:auto">'+block.html+'</table></body></html>'}function render(){const q=search.value.trim().toLowerCase();const shown=data.blocks.filter(b=>!q||(b.id+' '+b.name).toLowerCase().includes(q));count.textContent=shown.length+' из '+data.blocks.length;list.replaceChildren(...shown.map(block=>{const card=document.createElement('article');card.className='card';const meta=document.createElement('div');meta.className='meta';meta.innerHTML='<span class="id">'+block.id+'</span><strong class="name"></strong>';meta.querySelector('.name').textContent=block.name;const copy=document.createElement('button');copy.className='copy';copy.type='button';copy.textContent='Копировать HTML';copy.onclick=async()=>{await navigator.clipboard.writeText(block.html);copy.textContent='Скопировано';setTimeout(()=>copy.textContent='Копировать HTML',1200)};meta.append(copy);const preview=document.createElement('div');preview.className='preview';const frame=document.createElement('iframe');frame.title=block.id+' '+block.name;frame.srcdoc=doc(block);frame.onload=()=>{try{frame.style.height=Math.max(150,frame.contentDocument.documentElement.scrollHeight+8)+'px'}catch{}};preview.append(frame);card.append(meta,preview);return card}))}search.addEventListener('input',render);render();</script></body></html>
